extends: base.yaml
experiment:
  name: cpu-smoke
  rounds: 1
model:
  source: tiny
  kind: causal
  name_or_path: tiny-random-gpt2
data:
  train_file: examples/tiny_sft.jsonl
  max_length: 64
training:
  num_processes: 1
  allow_cpu: true
  trainer:
    bf16: false
    gradient_checkpointing: false
    gradient_accumulation_steps: 1
    per_device_train_batch_size: 2
    max_steps: 2
    logging_steps: 1
    save_strategy: 'no'
